name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**', 'docs/**', 'ci/**', 'refactor/**', 'test/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, format & unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      # TreatWarningsAsErrors is on: any analyzer warning fails here.
      - run: dotnet build -c Release --no-restore
      - run: dotnet format whitespace --verify-no-changes --no-restore
      - run: dotnet test tests/InvoiceExtractor.Domain.Tests -c Release --no-build
      - run: dotnet test tests/InvoiceExtractor.Evals.Tests -c Release --no-build
      # Scores the oracle against the committed manifest: proves the dataset, validator and scorer agree.
      # No model is called; the Haiku run is manual and budget-gated (evals/README.md).
      - run: dotnet run --project evals/InvoiceExtractor.Evals -c Release --no-build -- run oracle
