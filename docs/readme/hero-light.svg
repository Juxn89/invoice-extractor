<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">invoice-extractor</title>
<desc id="desc">Turns photos and PDFs of invoices into rows your accountant can use. Claude reads them, accounting rules check every reading, and a person reviews what does not add up.</desc>
<style>
	.flow { stroke-dasharray: 6 7; animation: flow 1.6s linear infinite; }
	.pop { opacity: 0; animation: pop .5s ease-out forwards; }
	.glow { animation: glow 2.4s ease-in-out infinite alternate; }
	@keyframes flow { to { stroke-dashoffset: -26; } }
	@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes glow { from { opacity: .55; } to { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } .pop { animation: none; opacity: 1; } }
</style>
<defs>
	<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset=".6" stop-color="#1d4ed8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<linearGradient id="metric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<radialGradient id="orbBlue"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0.15"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
	<radialGradient id="orbAmber"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.105"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
	<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1d4ed8" fill-opacity="0.08"/></pattern>
	<clipPath id="frame"><rect width="1280" height="460" rx="28"/></clipPath>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<g clip-path="url(#frame)">
	<rect width="1280" height="460" fill="#f7f9fd"/>
	<rect width="1280" height="460" fill="url(#dots)"/>
	<circle cx="180" cy="40" r="340" fill="url(#orbBlue)"/>
	<circle cx="1060" cy="470" r="360" fill="url(#orbAmber)"/>
</g>
<rect x=".5" y=".5" width="1279" height="459" rx="28" fill="none" stroke="#e2e8f0"/>

<g transform="translate(72 70)">
	<rect width="236" height="30" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
	<circle cx="18" cy="15" r="4.5" fill="#38bdf8" class="glow"/>
	<text x="31" y="20" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".1em" fill="#475569">OPEN SOURCE · .NET 10 · MIT</text>
</g>
<text x="68" y="172" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-.03em" fill="#0f172a">invoice<tspan fill="url(#brand)">-extractor</tspan></text>
<text x="72" y="230" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">From a photo or PDF to a row in your books.</text>
<text x="72" y="268" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">Claude reads it; accounting rules check every number.</text>
<text x="72" y="300" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">What does not add up goes to a person, never straight through.</text>
<g transform="translate(72 352)"><rect width="164.4" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="82.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Claude Haiku 5.5</text></g><g transform="translate(244.4 352)"><rect width="164.4" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="82.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Accounting rules</text></g><g transform="translate(416.8 352)"><rect width="130.8" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="65.4" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Human review</text></g><g transform="translate(555.6 352)"><rect width="147.60000000000002" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="73.80000000000001" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Postgres queue</text></g><g transform="translate(711.2 352)"><rect width="122.4" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0"/><text x="61.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Excel &amp; CSV</text></g>

<!-- A receipt, photographed at an angle -->
<g transform="translate(700 92) rotate(-6)" filter="url(#soft)">
	<rect width="150" height="226" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
	<rect x="18" y="20" width="84" height="9" rx="4.5" fill="#0f172a" fill-opacity=".85"/>
	<rect x="18" y="40" width="60" height="6" rx="3" fill="#cbd5e1"/><rect x="18" y="64" width="114" height="6" rx="3" fill="#cbd5e1"/><rect x="18" y="78" width="96" height="6" rx="3" fill="#cbd5e1"/><rect x="18" y="92" width="108" height="6" rx="3" fill="#cbd5e1"/>
	<rect x="18" y="116" width="114" height="1.5" fill="#cbd5e1"/>
	<rect x="82" y="130" width="50" height="6" rx="3" fill="#cbd5e1"/><rect x="82" y="144" width="50" height="6" rx="3" fill="#cbd5e1"/>
	<rect x="70" y="156" width="68" height="24" rx="6" fill="#f59e0b" fill-opacity="0.18" class="glow"/>
	<rect x="82" y="165" width="50" height="7" rx="3.5" fill="#f59e0b"/>
	<text x="18" y="208" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="11" fill="#475569">receipt.jpg</text>
</g>

<path d="M850 205 C 880 205, 872 150, 908 150" fill="none" stroke="#1d4ed8" stroke-width="2.2" class="flow"/>
<circle cx="850" cy="205" r="4.5" fill="#1d4ed8"/>

<!-- The reading, checked field by field -->
<g transform="translate(902 60)" filter="url(#soft)">
	<rect width="222" height="220" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
	<text x="18" y="32" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Checked reading</text>
	<g class="pop" style="animation-delay:.2s">
		<g transform="translate(16 46)">
			<rect width="190" height="34" rx="9" fill="#ffffff" fill-opacity="1" stroke="#e2e8f0" stroke-opacity="1"/>
			<text x="12" y="22" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Subtotal</text>
			<text x="150" y="22" text-anchor="end" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#0f172a">65.14</text>
			<circle cx="172" cy="17" r="8" fill="#16a34a" fill-opacity=".16"/><path d="M168.5 17l2.5 2.5 4.5-5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
		</g></g>
	<g class="pop" style="animation-delay:.6s">
		<g transform="translate(16 86)">
			<rect width="190" height="34" rx="9" fill="#ffffff" fill-opacity="1" stroke="#e2e8f0" stroke-opacity="1"/>
			<text x="12" y="22" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Tax</text>
			<text x="150" y="22" text-anchor="end" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#0f172a">6.68</text>
			<circle cx="172" cy="17" r="8" fill="#16a34a" fill-opacity=".16"/><path d="M168.5 17l2.5 2.5 4.5-5" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
		</g></g>
	<g class="pop" style="animation-delay:1s">
		<g transform="translate(16 126)">
			<rect width="190" height="34" rx="9" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-opacity="0.7"/>
			<text x="12" y="22" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#475569">Total</text>
			<text x="150" y="22" text-anchor="end" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#dc2626">81.82</text>
			<circle cx="172" cy="17" r="8" fill="#dc2626" fill-opacity=".16"/><text x="172" y="21.5" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#dc2626">!</text>
		</g></g>
	<g class="pop" style="animation-delay:1.4s">
		<text x="18" y="190" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#dc2626">65.14 + 6.68 ≠ 81.82</text>
		<text x="18" y="207" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#475569">→ sent to human review</text>
	</g>
</g>

<!-- What a person approved lands in the books -->
<path d="M1013 282 C 1013 320, 1060 330, 1080 352" fill="none" stroke="#f59e0b" stroke-width="2.2" class="flow"/>
<g transform="translate(1040 350)" filter="url(#soft)">
	<rect width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
	<rect x="14" y="14" width="22" height="22" rx="6" fill="#16a34a"/>
	<path d="M20 20h10M20 25h10M20 30h10M25 20v10" stroke="#fff" stroke-width="1.6"/>
	<text x="44" y="30" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">facturas.xlsx</text>
	<g class="pop" style="animation-delay:1.8s">
		<rect x="14" y="46" width="168" height="16" rx="5" fill="#1d4ed8" fill-opacity=".14"/>
		<text x="22" y="58" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" fill="#0f172a">INV-001277</text>
		<text x="174" y="58" text-anchor="end" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" font-weight="700" fill="#0f172a">71.82</text>
	</g>
</g>
</svg>
